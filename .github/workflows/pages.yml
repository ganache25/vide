name: Publier le site vitrine et la version web

on:
  push:
    branches: [main, claude/determined-ramanujan-dacozx]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La version web de l'application est servie dans le sous-dossier /app.
      - run: npx expo export --platform web --output-dir dist/app
      - name: Préparer le site
        run: |
          # Le site vitrine (site/) occupe la racine.
          cp -r site/. dist/
          # Liens profonds de l'application (/app/cocktail/…) : GitHub Pages renvoie 404.html.
          cp dist/app/index.html dist/404.html
          touch dist/.nojekyll
      - name: Pousser sur la branche gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication de ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
